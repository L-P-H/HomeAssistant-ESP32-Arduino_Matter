		<style> 
			body {background-color: #D8D8D8;}
			h2 {background-color:#008184; color:#FFFFFF; text-align:center; font-size:40px;}
			/* ------------------------------------------ */
			.gauge {
				position: relative;
				border-radius: 50%/100% 100% 0 0;
				background-color: var(--color, #a22);
				overflow: hidden;
				margin: 10px 10px 10px 10px;
				width: 350px;
				hight: auto;
			}
			.gauge:before{
				content: "";
				display: block;
				padding-top: 50%;   /* ratio of 2:1*/
			}
			.gauge .chart {
				overflow: hidden;
			}
			.gauge .mask {
				position: absolute;
				left: 20%;
				right: 20%;
				bottom: 0%;
				top: 40%;
				background-color: #D8D8D8;
				border-radius: 50%/100% 100% 0 0;
			}
			.gauge .percentage {
				position:  absolute;
				top: -1px;
				left: -1px;
				bottom: 0;
				right: -1px;
				background-color: var(--background, #aaa);
				transform:rotate(var(--rotation)); 
				transform-origin: bottom center; 
				transition-duration: 600;
			}
			.gauge:hover {
				--rotation: 100deg;
			}
			.gauge .value {
				position:absolute; bottom:0%; left:0;   
				width:100%; 
				text-align: center;
			}
			.gauge .min {
				position:absolute; 
				bottom:0; left:5%;   
			}
			.gauge .max {
				position:absolute; 
				bottom:0; right:5%;   
			}
			/* ------------------------------------------ */
			.chart {
				background: white;
				width: 100%;
				hight: auto;
				max-height: 500px;
				min-width: 350px;
				max-width: 3000px;
				border-left: 2px dotted #555;
				border-right: 2px dotted #555;
				border-top: 2px dotted #555;
				border-bottom: 2px dotted #555;
				padding: 10px 10px 10px 10px;
				margin: 10px 10px 10px 10px;
			}
			/* ------------------------------------------ */
			.labels {
				font-size: 13px;
			}
			.label-title {
				font-weight: bold;
				text-transform: uppercase;
				font-size: 12px;
				fill: black;
			}
			/* ------------------------------------------ */
		</style>
		
		<title>Arduino WIFI-Hotspot</title>
	</head>
	
	<body>

			SSID: "ssid"<br>

				<span class="value" style="font-size: 30px;">Bodenfeuchte:<br>"Moist"%</span>
			</div>
		</div>
		<!-- ------------------------------------------ -->
